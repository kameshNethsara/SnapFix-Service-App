<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapFix | Payments </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" />
    <link rel="stylesheet" href="/Front_End/css/pages/sidebar.css">
    <link rel="stylesheet" href="/Front_End/css/pages/topbar.css">
    <link rel="stylesheet" href="/Front_End/css/pages/admin-payment.css">
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>

    <!-- Sidebar
    <div id="sidebar"></div> -->

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Bar -->
        <div id="topbar"></div>

        <!-- Page Header -->
        <div class="page-header mb-4">
            <h1 class="h2 fw-bold text-primary">Payments Overview</h1>
            <p class="text-muted">Added User Payment Detailes</p>
        </div>

        <div class="container mt-4">
            <h3>Payments</h3>
            <div id="paymentContainer"></div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center py-4 d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Loading...</p>
        </div>

       
        <h3 class="mt-5 text-center" id="paymentsTableh3">Payments Table</h3>
        <div id="paymentsTableDiv">
            <table id="paymentsTable" class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>Service ID</th>
                        <th>User</th>
                        <th>Technician</th>
                        <th>Amount</th>
                        <th>Description</th>
                        <th>Bill</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

    <!-- JS Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="/Front_End/js/pages/sidebar.js"></script>
    <script src="/Front_End/js/pages/topbar.js"></script>
    <script src="/Front_End/js/pages/admin-payments.js"></script>
</body>
</html>
