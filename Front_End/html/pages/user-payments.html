<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapFix | Payments </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" />
    <link rel="stylesheet" href="/Front_End/css/pages/sidebar.css">
    <link rel="stylesheet" href="/Front_End/css/pages/topbar.css">
    <link rel="stylesheet" href="/Front_End/css/pages/user-payments.css">
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>

    <!-- Sidebar
    <div id="sidebar"></div> -->

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Bar -->
        <div id="topbar"></div>

        <!-- Page Header -->
        <div class="page-header mb-4">
            <h1 class="h2 fw-bold text-primary">Payments Overview</h1>
            <!-- <p class="text-muted">Complete payments securely via Stripe sandbox</p> -->
        </div>

        <div class="container mt-4">
            <div class="row g-4" id="paymentCards">
                <!-- Payment cards will be dynamically inserted here -->
            </div>
        </div>

        <!-- Payment model -->
        <div class="modal fade" id="securePaymentModal" tabindex="-1" aria-labelledby="securePaymentLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content secure-modal">

                    <!-- Header -->
                    <div class="modal-header secure-modal-header d-flex justify-content-between align-items-center">
                    <i class="bi bi-shield-lock-fill fs-4"></i>
                    <h5 class="modal-title mx-auto" id="securePaymentLabel">Payment</h5>
                    <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <!-- Body -->
                    <div class="modal-body">
                    <form id="payment-form">
                        <!-- Stripe Payment Element (new unified UI) -->
                        <div id="payment-element" class="mb-3"></div>

                        <!-- Errors -->
                        <div id="payment-errors" role="alert" class="text-danger mb-3"></div>

                        <!-- Submit Button -->
                        <button id="submit-payment" class="btn btn-primary w-100 mt-2">Pay <span id="payment-amount"></span></button>
                    </form>
                    </div>

                    <!-- Footer -->
                    <div class="modal-footer secure-modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    
                    </div>

                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center py-4 d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Loading...</p>
        </div>

        <!-- Payments Table  -->
        <div class="table-responsive" id="paymentsTableDiv">
            <table class="table table-hover" id="paymentsTable">
                <thead class="table-light">
                    <tr>
                        <th hidden>Request ID</th>
                        <th hidden>Payment ID</th>
                        <th>#</th>
                        <th>User Name</th>
                        <th>Assign Technician</th>
                        <th>Amount (LKR)</th>
                        <th>Method</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- JS Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="/Front_End/js/pages/sidebar.js"></script>
    <script src="/Front_End/js/pages/topbar.js"></script>
    <script src="/Front_End/js/pages/user-payments.js"></script>
</body>
</html>
