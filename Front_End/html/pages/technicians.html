<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapFix | Technicians</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/Front_End/css/pages/sidebar.css">
    <link rel="stylesheet" href="/Front_End/css/pages/topbar.css">
    <link rel="stylesheet" href="/Front_End/css/pages/technicians.css">
</head>
<body>

    <!-- Sidebar placeholder -->
    <div id="sidebar"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Bar -->
        <div id="topbar"></div>

        <!-- Page Header with Filters -->
        <div class="page-header">
            <h1 class="h2 fw-bold text-primary">Technicians Overview</h1>
            <div class="filter-container">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" placeholder="Search technicians..." id="searchInput">
                </div>
                <select class="filter-select" id="availabilityFilter">
                    <option value="all">All Technicians</option>
                    <option value="available">Available Only</option>
                </select>
                <select class="filter-select" id="sortSelect">
                    <option value="rating">Sort by Rating</option>
                    <option value="name">Sort by Name</option>
                </select>
            </div>
        </div>

        <!-- Technician Cards Container -->
        <div class="row" id="technician-cards">
            <div class="loading-spinner">
                <div class="spinner"></div>
            </div>
        </div>
    </div>


<!-- jQuery CDN (v3.7.1) -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/Front_End/js/pages/sidebar.js"></script>
<script src="/Front_End/js/pages/technicians.js"></script>
<script src="/Front_End/js/pages/topbar.js"></script>
</body>
</html>
