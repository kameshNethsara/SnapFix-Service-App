<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapFix | Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/Front_End/css/pages/sidebar.css">
    <link rel="stylesheet" href="/Front_End/css/pages/topbar.css">
    <link rel="stylesheet" href="/Front_End/css/pages/users.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" />
</head>
<body>

    <!-- Sidebar placeholder -->
    <div id="sidebar"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Bar -->
        <div id="topbar"></div>

        <h1 class="h2 fw-bold text-primary">Users Overview</h1>

        <!-- User Stats -->
       <div class="row user-stats">
            <div class="col-lg-3 col-md-6 col-6 stat-item">
                <div id="totalCount" class="stat-value">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="col-lg-3 col-md-6 col-6 stat-item">
                <div id="adminCount" class="stat-value">0</div>
                <div class="stat-label">Admins</div>
            </div>
            <div class="col-lg-3 col-md-6 col-6 stat-item">
                <div id="techCount" class="stat-value">0</div>
                <div class="stat-label">Technicians</div>
            </div>
            <div class="col-lg-3 col-md-6 col-6 stat-item">
                <div id="userCount" class="stat-value">0</div>
                <div class="stat-label">Users</div>
            </div>
        </div>

        <!-- User Add Form -->
        <form id="addUserForm" class="mb-5">
        <div class="row g-3">

            <!-- Image Upload Field -->
           <div class="row align-items-center g-3">
            <!-- File Chooser -->
            <div class="col-md-6">
                <label for="userImg" class="form-label">Profile Image</label>
                <input type="file" class="form-control" id="userImg" accept="image/*" />
            </div>

            <!-- Image Preview -->
            <div class="col-md-6 text-center">
                <img id="userImgPreview" src="" alt="Preview" class="preview-img" />
            </div>

            <div class="col-md-6">
            <label for="userFullName" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="userFullName" placeholder="Enter full name" required />
            </div>

            <div class="col-md-6">
            <label for="userEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="userEmail" placeholder="Enter email" required />
            </div>

            <div class="col-md-6">
            <label for="userMobile" class="form-label">Mobile</label>
            <input type="tel" class="form-control" id="userMobile" placeholder="Enter mobile number" required />
            </div>

            <div class="col-md-6">
            <label for="userRole" class="form-label">Role</label>
            <select class="form-select" id="userRole" required>
                <option value="" disabled selected>Select role</option>
                <option value="ADMIN">Admin</option>
                <option value="TECHNICIAN">Technician</option>
                <option value="USER">User</option>
                <!-- Add more roles as needed -->
            </select>
            </div>

            <div class="col-md-6">
                <label class="form-label" for="userStreet">Street</label>
                <input type="text" class="form-control" id="userStreet" placeholder="Enter your street name">
            </div>

            <div class="col-md-6">
                <label class="form-label" for="userCity">City</label>
                <input type="text" class="form-control" id="userCity" placeholder="Enter your city">
            </div>

            <div class="col-md-6">
                <label class="form-label" for="userPostalCode">Postal Code</label>
                <input type="text" class="form-control" id="userPostalCode" placeholder="Enter your postal code">
            </div>

            <!-- <div class="col-md-6">
            <label for="userDepartment" class="form-label">Department</label>
            <input type="text" class="form-control" id="userDepartment" placeholder="Enter department" />
            </div> -->

            <div class="col-md-6">
            <label for="userDepartment" class="form-label">Department</label>
            <select class="form-control" id="userDepartment">
                <option value="" disabled selected>Select department</option>
                <option value="AC">AC</option>
                <option value="Plumbing">Plumbing</option>
                <option value="Electrical">Electrical</option>
                <option value="Carpentry">Carpentry</option>
                <option value="Painting">Painting</option>
                <option value="Cleaning">Cleaning</option>
                <option value="Networking">Networking</option>
                <option value="Appliance Repair">Appliance Repair</option>
                <option value="HVAC">HVAC</option>
                <option value="Masonry">Masonry</option>
                <option value="Roofing">Roofing</option>
                <option value="Pest Control">Pest Control</option>
                <option value="ICT">ICT</option>
                <option value="Hardware">Hardware</option>
            </select>
        </div>

            <div class="col-md-6">
            <label for="userName" class="form-label">Username</label>
            <input type="text" class="form-control" id="userName" placeholder="Enter username" required />
            </div>

            <div class="col-md-6">
            <label for="userPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="userPassword" placeholder="Enter password" required />
            </div>

        </div>

        <!-- Add User -->
        <!-- Add -->
        <div class="d-flex gap-3 mt-4 flex-wrap">
            <!-- Add User -->
            <button type="submit" class="btn btn-success" id="btnAdd">
                <i class="fa fa-user-plus me-2"></i>Add User
            </button>

            <!-- Update -->
            <button type="button" class="btn btn-warning text-white" id="btnUpdate">
                <i class="fa fa-edit me-2"></i>Update
            </button>

            <!-- Delete -->
            <button type="button" class="btn btn-danger" id="btnDelete">
                <i class="fa fa-trash me-2"></i>Delete
            </button>

            <!-- Clear -->
            <button type="reset" class="btn btn-secondary" id="btnClear">
                <i class="fa fa-times me-2"></i>Clear
            </button>
        </div>

        </form>

        <!-- Users Table -->
        <div class="table-responsive">
        <table class="table table-striped table-bordered" id="usersTable">
            <thead class="table-dark">
            <th>#</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Mobile</th>
            <th>Role</th>
            <th>Department</th>
            <th>Username</th>
            <!-- <th>Availability</th> -->
            <th>Status</th>
            <th>Action</th>
            <tbody>
            <!-- User rows will be appended here dynamically -->
            </tbody>
        </table>
        </div>

        
    </div>

<!-- jQuery CDN (v3.7.1) -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/Front_End/js/pages/sidebar.js"></script>
<script src="/Front_End/js/pages/users.js"></script>
<script src="/Front_End/js/pages/topbar.js"></script>
 <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
</body>
</html>
